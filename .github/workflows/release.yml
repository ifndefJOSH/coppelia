name: Release macOS + iOS + Android + Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Package app
        run: |
          APP_PATH="build/macos/Build/Products/Release/Coppelia.app"
          ZIP_PATH="Coppelia-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coppelia-macos
          path: Coppelia-macos.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Coppelia-macos.zip

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app (Simulator)
        run: flutter build ios --simulator --no-codesign

      - name: Package app
        run: |
          APP_PATH="build/ios/iphonesimulator/Runner.app"
          ZIP_PATH="Coppelia-ios-simulator.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coppelia-ios-simulator
          path: Coppelia-ios-simulator.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Coppelia-ios-simulator.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Package APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Coppelia-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coppelia-android
          path: Coppelia-android.apk

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Coppelia-android.apk

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            clang \
            cmake \
            desktop-file-utils \
            libfuse2t64 \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            rpm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Fastforge
        run: |
          dart pub global activate fastforge
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install appimagetool
        run: |
          curl -sSL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Build Linux bundle
        run: flutter build linux --release

      - name: Package bundle
        run: |
          tar -czf Coppelia-linux.tar.gz -C build/linux/x64/release/bundle .

      - name: Build Linux packages
        run: fastforge release --name dev

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coppelia-linux
          if-no-files-found: error
          path: |
            Coppelia-linux.tar.gz
            dist/**

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Coppelia-linux.tar.gz
            dist/**
